<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repertorio · Uranthia y su Corazón Latino</title>

  <link rel="icon" type="image/png" href="logo-uranthia.png" />
  <link rel="apple-touch-icon" href="logo-uranthia.png" />
  <meta name="description" content="Repertorio completo de Uranthia y su Corazón Latino, organizado por estilos musicales." />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --fondo: linear-gradient(135deg, #0d2818 0%, #1a3d2a 50%, #0d2818 100%);
      --card-bg: #ffffff;
      --card-texto: #0d2818;
      --card-sub: #6b7a6b;
      --borde: rgba(212, 175, 55, 0.30);
      --dorado: #d4af37;
      --dorado-suave: #f5d76e;
      --sombra: rgba(0, 0, 0, 0.55);
    }

    /* MODO SHOW */
    body.modo-show {
      --fondo: linear-gradient(135deg, #000000 0%, #0a0a0a 50%, #000000 100%);
      --card-bg: #0a0a0a;
      --card-texto: #f5d76e;
      --card-sub: #d4af37;
      --borde: rgba(212, 175, 55, 0.55);
      --sombra: rgba(212, 175, 55, 0.20);
    }

    /* MODO DÍA */
    body.modo-dia {
      --fondo: linear-gradient(135deg, #e8f0e8 0%, #f0f5f0 50%, #e8f0e8 100%);
      --card-bg: #ffffff;
      --card-texto: #0d2818;
      --card-sub: #6b7a6b;
      --borde: rgba(212, 175, 55, 0.40);
      --sombra: rgba(0, 0, 0, 0.15);
    }

    body {
      background: var(--fondo);
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 30px 20px;
      color: var(--card-texto);
      transition: background 0.4s ease;
    }

    .card {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 36px;
      padding: 38px 38px 32px;
      box-shadow: 0 25px 60px var(--sombra), 0 0 0 2px var(--borde);
      border: 1px solid var(--borde);
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, #0d2818 0%, #1a3d2a 100%);
      border-radius: 28px;
      padding: 26px 32px;
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
      margin-bottom: 28px;
      box-shadow: 0 8px 30px rgba(13, 40, 24, 0.40), inset 0 1px 0 rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.25);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .logo-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #d4af37;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35), 0 0 0 4px rgba(212, 175, 55, 0.10);
      flex-shrink: 0;
      background: #0d2818;
      position: relative;
      z-index: 1;
    }

    .header-text { flex: 1; min-width: 200px; position: relative; z-index: 1; }

    .header-text .band-name {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 2rem;
      font-weight: 900;
      color: #d4af37;
      letter-spacing: 1.5px;
      line-height: 1.1;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(212, 175, 55, 0.30);
    }

    .header-text .band-sub {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1.1rem;
      font-weight: 400;
      font-style: italic;
      color: #f5e6c8;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .header-text .tagline {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #0d2818;
      background: linear-gradient(135deg, #d4af37 0%, #f5d76e 100%);
      padding: 5px 18px;
      border-radius: 30px;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 3px 10px rgba(212, 175, 55, 0.30);
    }

    /* ── MODO SELECTOR ── */
    .modo-selector {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .modo-btn {
      background: var(--card-bg);
      border: 2px solid var(--borde);
      color: var(--card-texto);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
    }
    .modo-btn:hover {
      border-color: var(--dorado);
      background: #faf3e0;
      color: #0d2818;
    }
    .modo-btn.active {
      background: linear-gradient(135deg, #d4af37 0%, #f5d76e 100%);
      color: #0d2818;
      border-color: #0d2818;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.40);
    }

    /* ── TÍTULO ── */
    .main-title { text-align: center; margin: 8px 0 22px 0; }
    .main-title h1 {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--card-texto);
      letter-spacing: -0.5px;
      line-height: 1.15;
    }
    .main-title h1 .gold {
      background: linear-gradient(135deg, #b8860b 0%, #d4af37 50%, #f5d76e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .main-title .subtitle {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--card-sub);
      font-style: italic;
    }

    /* ── BUSCADOR ── */
    .search-box {
      position: relative;
      margin-bottom: 18px;
    }
    .search-box input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      border-radius: 50px;
      border: 2px solid var(--dorado);
      background: var(--card-bg);
      font-size: 1rem;
      font-family: inherit;
      color: var(--card-texto);
      outline: none;
      transition: all 0.2s ease;
    }
    .search-box input:focus {
      border-color: var(--card-texto);
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.20);
    }
    .search-box .icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      pointer-events: none;
    }

    /* ── FILTROS ── */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 26px;
      justify-content: center;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 2px solid var(--borde);
      color: var(--card-texto);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
    }
    .filter-btn:hover {
      border-color: var(--dorado);
      background: #faf3e0;
      color: #0d2818;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #0d2818 0%, #1a3d2a 100%);
      color: #d4af37;
      border-color: #d4af37;
      box-shadow: 0 4px 12px rgba(13, 40, 24, 0.25);
    }

    /* ── ESTILO ── */
    .estilo {
      margin-bottom: 26px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--borde);
      background: var(--card-bg);
      transition: all 0.2s ease;
    }

    .estilo-header {
      background: linear-gradient(135deg, #0d2818 0%, #1a3d2a 100%);
      color: #d4af37;
      padding: 16px 22px;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }
    .estilo-header .estilo-nombre { display: flex; align-items: center; gap: 12px; }
    .estilo-header .estilo-icono { font-size: 1.4rem; }
    .estilo-header .estilo-count {
      font-size: 0.75rem;
      background: rgba(212, 175, 55, 0.20);
      color: #f5e6c8;
      padding: 4px 12px;
      border-radius: 30px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .estilo-header .toggle-icon {
      font-size: 1rem;
      transition: transform 0.3s ease;
    }
    .estilo-header.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }

    .estilo-body {
      padding: 18px 22px 22px;
      transition: all 0.3s ease;
    }

    /* ── SUBGRUPO ── */
    .subgrupo {
      margin-top: 14px;
      padding: 12px 18px;
      background: var(--card-bg);
      border-radius: 12px;
      border-left: 4px solid var(--dorado);
    }
    .subgrupo:first-child { margin-top: 0; }

    .subgrupo-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1rem;
      font-weight: 800;
      color: var(--card-texto);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }
    .subgrupo-header .subgrupo-icono { font-size: 1.1rem; }
    .subgrupo-header .subgrupo-count {
      font-size: 0.7rem;
      background: #f5e6c8;
      color: #b8860b;
      padding: 2px 10px;
      border-radius: 30px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-left: auto;
    }

    /* ── CANCIONES ── */
    .cancion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      border: 1px solid var(--borde);
      border-left: 4px solid var(--dorado);
      transition: all 0.2s ease;
    }
    .cancion:last-child { margin-bottom: 0; }
    .cancion:hover {
      border-left-color: #0d2818;
      box-shadow: 0 4px 12px rgba(13, 40, 24, 0.08);
    }

    .cancion-info { flex: 1; min-width: 0; }
    .cancion-info .titulo {
      font-weight: 700;
      color: var(--card-texto);
      font-size: 0.95rem;
      line-height: 1.3;
    }
    .cancion-info .artista {
      font-size: 0.8rem;
      color: var(--card-sub);
      font-style: italic;
      margin-top: 2px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      display: inline-block;
      transition: all 0.2s ease;
    }
    .cancion-info .artista:hover {
      background: rgba(212, 175, 55, 0.15);
      color: var(--dorado);
    }
    .cancion-info .artista.vacio {
      color: #b8c0b8;
    }
    .cancion-info .artista-input {
      font-size: 0.8rem;
      font-style: italic;
      margin-top: 2px;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1.5px solid var(--dorado);
      background: var(--card-bg);
      color: var(--card-texto);
      font-family: inherit;
      width: 100%;
      max-width: 300px;
      outline: none;
    }

    .cancion-botones {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-mini {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 30px;
      border: 1.5px solid var(--borde);
      background: var(--card-bg);
      color: #b8c0b8;
      cursor: not-allowed;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .btn-mini.activo {
      border-color: var(--dorado);
      color: var(--card-texto);
      background: #faf3e0;
      cursor: pointer;
    }
    .btn-mini.activo:hover {
      background: linear-gradient(135deg, #d4af37 0%, #f5d76e 100%);
      border-color: #0d2818;
    }

    /* ── EMPTY ── */
    .empty-msg {
      font-size: 0.85rem;
      color: var(--card-sub);
      font-style: italic;
      padding: 10px 0;
      text-align: center;
      background: rgba(212, 175, 55, 0.08);
      border-radius: 8px;
      border: 1px dashed var(--borde);
    }

    /* ── ACCIONES ── */
    .actions-bar {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 2px solid var(--dorado);
      background: linear-gradient(135deg, #0d2818 0%, #1a3d2a 100%);
      color: #d4af37;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 12px 24px;
      border-radius: 30px;
      cursor: pointer;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(13, 40, 24, 0.20);
      text-decoration: none;
    }
    .action-btn:hover {
      background: linear-gradient(135deg, #d4af37 0%, #f5d76e 100%);
      color: #0d2818;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.40);
    }
    .action-btn.secondary {
      background: var(--card-bg);
      color: var(--card-sub);
      border-color: var(--borde);
    }
    .action-btn.secondary:hover {
      border-color: var(--dorado);
      color: #0d2818;
      background: #faf3e0;
    }

    /* ── FOOTER ── */
    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 2px solid var(--borde);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }
    .footer-credits {
      font-size: 0.85rem;
      color: #0d2818;
      font-weight: 600;
      background: linear-gradient(135deg, #f5e6c8 0%, #faf3e0 100%);
      padding: 8px 22px;
      border-radius: 30px;
      border: 1px solid var(--borde);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .footer-credits .names { font-weight: 800; color: #b8860b; letter-spacing: 0.8px; }
    .footer-tag {
      font-size: 0.7rem;
      font-weight: 700;
      color: #d4af37;
      background: #0d2818;
      padding: 5px 18px;
      border-radius: 30px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      border: 1px solid var(--borde);
    }

    /* ── AVISO ── */
    .aviso {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #0d2818 0%, #1a3d2a 100%);
      color: #d4af37;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.50);
      border: 2px solid #d4af37;
      z-index: 1000;
    }
    .aviso.show { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @media (max-width: 650px) {
      body { padding: 16px 10px; }
      .card { padding: 20px 14px; border-radius: 24px; }
      .header { flex-direction: column; text-align: center; padding: 20px; gap: 14px; }
      .logo-img { width: 90px; height: 90px; }
      .header-text .band-name { font-size: 1.5rem; }
      .main-title h1 { font-size: 1.5rem; }
      .filter-btn { font-size: 0.7rem; padding: 6px 12px; }
      .estilo-header { font-size: 1rem; padding: 14px 16px; }
      .estilo-body { padding: 14px 14px 18px; }
      .subgrupo { padding: 10px 14px; }
      .cancion { flex-direction: column; align-items: flex-start; gap: 8px; }
      .cancion-botones { width: 100%; }
      .btn-mini { font-size: 0.65rem; padding: 4px 8px; }
      .action-btn { font-size: 0.75rem; padding: 10px 18px; }
    }
  </style>
</head>

    <div id="repertorio"></div>

    <!-- ACCIONES -->

  </div>

    // ══════════════════════════════════════════════════════
    // RENDERIZAR REPERTORIO
    // ══════════════════════════════════════════════════════
    const STORAGE_KEY = 'uranthia-artistas';
    const datosGuardados = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

    function renderizarRepertorio() {
      const contenedor = document.getElementById('repertorio');
      contenedor.innerHTML = '';

      REPERTORIO.forEach(estilo => {
        const totalCanciones = estilo.subgrupos.reduce((sum, sg) => sum + sg.canciones.length, 0);

        const divEstilo = document.createElement('div');
        divEstilo.className = 'estilo';
        divEstilo.dataset.estilo = estilo.id;

        let htmlSubgrupos = '';
        estilo.subgrupos.forEach(subgrupo => {
          if (subgrupo.canciones.length === 0) return;

          let htmlCanciones = '';
          subgrupo.canciones.forEach((cancion, index) => {
            const key = `${estilo.id}|${subgrupo.nombre}|${cancion.titulo}`;
            const artistaGuardado = datosGuardados[key] !== undefined ? datosGuardados[key] : cancion.artista;
            const artistaMostrar = artistaGuardado || '— sin artista —';
            const claseVacio = artistaGuardado ? '' : 'vacio';

            htmlCanciones += `
              <div class="cancion">
                <div class="cancion-info">
                  <div class="titulo">${cancion.titulo}</div>
                  <div class="artista ${claseVacio}" data-key="${key}" onclick="editarArtista(this)">${artistaMostrar}</div>
                </div>
                <div class="cancion-botones">
                  <span class="btn-mini">▶ YouTube</span>
                  <span class="btn-mini">📄 Letra</span>
                  <span class="btn-mini">🎸 Acordes</span>
                  <span class="btn-mini">🎹 Piano</span>
                  <span class="btn-mini">🎸 Bajo</span>
                </div>
              </div>
            `;
          });

          htmlSubgrupos += `
            <div class="subgrupo">
              <div class="subgrupo-header">
                <span class="subgrupo-icono">${subgrupo.icono}</span>
                <span>${subgrupo.nombre}</span>
                <span class="subgrupo-count">${subgrupo.canciones.length}</span>
              </div>
              ${htmlCanciones}
            </div>
          `;
        });

        divEstilo.innerHTML = `
          <div class="estilo-header">
            <div class="estilo-nombre">
              <span class="estilo-icono">${estilo.icono}</span>
              <span>${estilo.nombre}</span>
            </div>
            <div>
              <span class="estilo-count">${totalCanciones} canciones</span>
              <span class="toggle-icon">▼</span>
            </div>
          </div>
          <div class="estilo-body">
            ${htmlSubgrupos}
          </div>
        `;

        contenedor.appendChild(divEstilo);
      });

      // Reconectar eventos
      conectarEventos();
    }

    // ══════════════════════════════════════════════════════
    // EDITAR ARTISTA
    // ══════════════════════════════════════════════════════
    function editarArtista(el) {
      const key = el.dataset.key;
      const valorActual = el.textContent === '— sin artista —' ? '' : el.textContent;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'artista-input';
      input.value = valorActual;
      input.placeholder = 'Escribe el artista...';

      el.replaceWith(input);
      input.focus();

      const guardar = () => {
        const nuevoValor = input.value.trim();
        datosGuardados[key] = nuevoValor;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(datosGuardados));

        const nuevoDiv = document.createElement('div');
        nuevoDiv.className = 'artista' + (nuevoValor ? '' : ' vacio');
        nuevoDiv.dataset.key = key;
        nuevoDiv.textContent = nuevoValor || '— sin artista —';
        nuevoDiv.onclick = () => editarArtista(nuevoDiv);
        input.replaceWith(nuevoDiv);
      };

      input.addEventListener('blur', guardar);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          input.blur();
        }
      });
    }

    // ══════════════════════════════════════════════════════
    // EVENTOS
    // ══════════════════════════════════════════════════════
    function conectarEventos() {
      // Colapsar / expandir
      document.querySelectorAll('.estilo-header').forEach(header => {
        header.onclick = () => {
          const body = header.nextElementSibling;
          header.classList.toggle('collapsed');
          body.style.display = body.style.display === 'none' ? '' : 'none';
        };
      });
    }

    // ══════════════════════════════════════════════════════
    // FILTROS
    // ══════════════════════════════════════════════════════
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filtro = btn.dataset.estilo;
        document.querySelectorAll('.estilo').forEach(estilo => {
          if (filtro === 'todos' || estilo.dataset.estilo === filtro) {
            estilo.style.display = '';
          } else {
            estilo.style.display = 'none';
          }
        });
      });
    });

    // ══════════════════════════════════════════════════════
    // BUSCADOR
    // ══════════════════════════════════════════════════════
    document.getElementById('buscador').addEventListener('input', (e) => {
      const texto = e.target.value.toLowerCase().trim();
      document.querySelectorAll('.cancion').forEach(cancion => {
        const titulo = cancion.querySelector('.titulo').textContent.toLowerCase();
        const artista = cancion.querySelector('.artista').textContent.toLowerCase();
        if (titulo.includes(texto) || artista.includes(texto)) {
          cancion.style.display = '';
        } else {
          cancion.style.display = 'none';
        }
      });
    });

    // ══════════════════════════════════════════════════════
    // MODO DÍA / NOCHE / SHOW
    // ══════════════════════════════════════════════════════
    function cambiarModo(modo) {
      document.body.classList.remove('modo-dia', 'modo-noche', 'modo-show');
      document.body.classList.add('modo-' + modo);
      document.querySelectorAll('.modo-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.modo-btn[data-modo="${modo}"]`).classList.add('active');
      localStorage.setItem('uranthia-modo', modo);
    }

    // Cargar modo guardado
    const modoGuardado = localStorage.getItem('uranthia-modo') || 'noche';
    cambiarModo(modoGuardado);

    // ══════════════════════════════════════════════════════
    // AVISO
    // ══════════════════════════════════════════════════════
    function avisoProximamente() {
      const aviso = document.getElementById('aviso');
      aviso.classList.add('show');
      setTimeout(() => aviso.classList.remove('show'), 2500);
    }

    // ══════════════════════════════════════════════════════
    // INICIALIZAR
    // ══════════════════════════════════════════════════════
    renderizarRepertorio();
  </script>
